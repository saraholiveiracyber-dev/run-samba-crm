<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Painel administrativo Run & Samba CRM 2026.">
<title>Run & Samba CRM</title>
<link rel="stylesheet" href="css/crm.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
</head>

<body class="login-page">

<main class="login-card">

<div class="brand-mark">RUN & SAMBA</div>

<span class="eyebrow">PAINEL ADMINISTRATIVO</span>

<h1>CRM</h1>

<p>
Entre para gerenciar inscrições, pagamentos e participantes.
</p>

<form id="loginForm">

<label>
E-mail
<input id="email" type="email" autocomplete="email" required>
</label>

<label>
Senha
<input id="password" type="password" autocomplete="current-password" required>
</label>

<button class="primary-btn" type="submit">
ENTRAR <strong>→</strong>
</button>

<div id="loginMessage" class="message"></div>

</form>

</main>

<script>

document.getElementById("loginForm").addEventListener("submit", async (e) => {

e.preventDefault();

const msg = document.getElementById("loginMessage");

msg.textContent = "Entrando...";

const { error } = await window.crmAuth.signIn(
document.getElementById("email").value.trim(),
document.getElementById("password").value
);

if (error) {

msg.textContent =
error.message || "Não foi possível entrar.";

return;

}

location.href = "dashboard.html";

});

</script>

</body>
</html>
